name: Docs

# The docs site at saaio.dev: built from the Markdown on every pull request, so a broken link or
# anchor fails it, and deployed to GitHub Pages from main.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  PAGEFIND_VERSION: v1.5.2
  PAGEFIND_SHA256: afb824a9e7f64905a934900481cea5be679c03975e527329e0e5e6cc70f5feda

jobs:
  site:
    name: site
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo run --locked --features site --bin saaio-site -- _site
      - name: Index for search
        run: |
          tarball="pagefind-$PAGEFIND_VERSION-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSLO "https://github.com/Pagefind/pagefind/releases/download/$PAGEFIND_VERSION/$tarball"
          echo "$PAGEFIND_SHA256  $tarball" | sha256sum -c
          tar xzf "$tarball" pagefind
          ./pagefind --site _site
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: deploy
    if: github.ref == 'refs/heads/main'
    needs: site
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
