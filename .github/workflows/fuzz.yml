# Fuzzing finds new inputs over long runs: a short run on every pull request finds little and makes
# a required check slow and nondeterministic. The pull request gate is the property tests in
# cargo test, which share their oracles (src/fuzzing.rs) with these targets; this runs each target
# five minutes every week and on demand. Not a required check. A crash fails the run and uploads
# the input; CONTRIBUTING.md, Fuzzing, says how to replay it.
name: fuzz

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fuzz:
    name: fuzz (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        target: [frames, log_line, log, hook_claude_code, hook_codex]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly --profile minimal
      - run: cargo install cargo-fuzz@0.13.2 --locked
      - name: Seed the hook targets with the recorded payloads
        if: startsWith(matrix.target, 'hook_')
        env:
          TARGET: ${{ matrix.target }}
        run: |
          harness=${TARGET#hook_}
          mkdir -p ".fuzz/corpus/$TARGET"
          cp "src/adapter/fixtures/${harness//_/-}"/*.json ".fuzz/corpus/$TARGET/"
      - run: cargo +nightly fuzz run --fuzz-dir .fuzz "$TARGET" -- -max_total_time=300
        env:
          TARGET: ${{ matrix.target }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-${{ matrix.target }}
          path: .fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
