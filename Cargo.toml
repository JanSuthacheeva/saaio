[package]
name = "saaio"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "Orchestrate coding agents from one terminal: a master agent and one worker per feature, each in its own git worktree"
repository = "https://github.com/JanSuthacheeva/saaio"
# Installed from GitHub releases or with cargo install --git, never from crates.io.
publish = false

[dependencies]
alacritty_terminal = "0.26"
anyhow = "1.0.104"
base64 = "0.22"
clap = { version = "4.6.7", features = ["derive", "env"] }
clap_complete = "4.6.11"
jiff = { version = "0.2.38", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
nix = { version = "0.28.0", default-features = false, features = ["socket"] }
portable-pty = "0.9.0"
postcard = { version = "1.1.3", features = ["use-std"] }
pulldown-cmark = "0.13.4"
ratatui = "0.30.2"
rustix = { version = "1.1.5", features = ["net", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_toon_format = "0.2.0"
sha2 = "0.10"
signal-hook = { version = "0.4.5", features = ["extended-siginfo"] }
toml = "1.1.8"
unicode-width = "0.2.2"
uuid = { version = "1.28.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"

# release.yml and cargo install both build this profile. panic stays unwind: the panic hooks
# log a thread's panic before the process ends. strip keeps the symbols, so the backtrace they
# write to server.log names its functions.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[lints.rust]
# Safe APIs cover every system call saaio makes.
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Module files are foo.rs beside foo/, never foo/mod.rs.
mod_module_files = "warn"
# Docs name env vars and commands in plain prose, and no rustdoc is published.
doc_markdown = "allow"
doc_link_with_quotes = "allow"
# 0xrrggbb colors mirror #rrggbb in theme files; the FNV-1a constants match the spec.
unreadable_literal = "allow"
# Terminal sizes, card counts and millisecond clocks are bounded far below the target types.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
# Sent.sent, Removed.removed, Projects.projects: TOON keys and the --json contract.
struct_field_names = "allow"
# Words that are close, such as they and them, or argv and args.
similar_names = "allow"
# An explicit arm that does nothing documents a key that does nothing.
match_same_arms = "allow"
# map_or_else puts the default first and reads worse.
map_unwrap_or = "allow"
