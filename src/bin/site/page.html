<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{title}}</title>
<meta name="description" content="saaio orchestrates coding agents from one terminal: a master agent and one worker per feature, each in its own git worktree.">
<link rel="canonical" href="https://saaio.dev{{url}}">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script>try { const theme = localStorage.getItem("theme"); if (theme) document.documentElement.dataset.theme = theme } catch {}</script>
<link rel="stylesheet" href="/pagefind/pagefind-component-ui.css">
<link rel="stylesheet" href="/site.css">
<script src="/site.js" defer></script>
<script src="/pagefind/pagefind-component-ui.js" type="module"></script>
</head>
<body class="{{kind}}">
<a class="skip" href="#content">Skip to content</a>
<header class="top">
  <div class="top-inner">
    <button class="icon menu" type="button" aria-label="Pages" aria-expanded="false" aria-controls="nav">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <a class="brand" href="/"><span class="wordmark">saaio</span><span class="version">v{{version}}</span></a>
    <button class="search-button" type="button">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span>Search the docs</span><kbd>⌘K</kbd>
    </button>
    <div class="top-links">
      <a class="text" href="/docs/"{{docs_current}}>Docs</a>
      <a class="text" href="/changelog/"{{changelog_current}}>Changelog</a>
      <button class="icon search-icon" type="button" aria-label="Search">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </button>
      <button class="icon theme" type="button" aria-label="Switch between light and dark">
        <svg class="i sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="i moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      </button>
      <a class="icon" href="https://github.com/JanSuthacheeva/saaio" aria-label="saaio on GitHub">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 19c-4.3 1.4-4.3-2.5-6-3m12 5v-3.5c0-1 .1-1.4-.5-2 2.8-.3 5.5-1.4 5.5-6a4.6 4.6 0 0 0-1.3-3.2 4.2 4.2 0 0 0-.1-3.2s-1.1-.3-3.5 1.3a12.3 12.3 0 0 0-6.2 0C6.5 2.8 5.4 3.1 5.4 3.1a4.2 4.2 0 0 0-.1 3.2A4.6 4.6 0 0 0 4 9.5c0 4.6 2.7 5.7 5.5 6-.6.6-.6 1.2-.5 2V21"/></svg>
      </a>
    </div>
  </div>
</header>
<pagefind-modal></pagefind-modal>
<div class="layout">
  <nav id="nav" class="nav" aria-label="Pages">
{{nav}}
  </nav>
  <div class="scrim"></div>
  <main id="content" class="content">
{{eyebrow}}
    <article data-pagefind-body>
{{body}}
    </article>
{{pager}}
  </main>
  <aside class="outline" aria-label="On this page">
{{outline}}
  </aside>
</div>
<footer class="foot">
  <div class="foot-inner">
    <span>saaio is free software, MIT or Apache-2.0.</span>
    <span>Built from the Markdown in <a href="https://github.com/JanSuthacheeva/saaio">the repository</a>.</span>
  </div>
</footer>
</body>
</html>
