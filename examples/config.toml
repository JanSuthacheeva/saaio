# flow's settings.
#
# flow wrote this file on its first run. Every setting is commented out and shows its default.
# Remove the # in front of a setting to change it. flow never overwrites this file once you edit it.
#
# Commands read it each time they run. flow ui and its server read it when they start, so a change
# to [agents], a prompt, [master] or [ui] applies after flow ui --stop and the next flow ui. A key
# flow does not know is an error that names the file and the key.
# All of it, explained: https://github.com/JanSuthacheeva/flow/blob/main/docs/configuration.md

#[worker]
# The agent a new flow runs when you pick none: a name under [agents].
#agent = "claude"
# The first prompt of every agent that sets none of its own, the built-in ones too. Unset, each
# agent keeps its own. Claude Code calls a skill /name and Codex $name.
# For example: prompt = "{request}"

#[master]
# Wake the master when a worker stops. false: it learns only when it runs flow status.
#wake = true
# The agent flow ui runs as the master. Unset, the built-in "master" agent below.
# For example: agent = "codex"

#[ui]
# The key before every flow ui command: "C-space", or "C-a" to "C-z" except C-c, C-d, C-h, C-i,
# C-j, C-m, C-q, C-s and C-z, which a pane needs.
#prefix = "C-space"

# The workflow: 1 to 4 phases in order, each with the skills that start it. They are a flow's
# steps in flow ui. A new list replaces all four.
#[[phases]]
#name = "plan"
#skills = ["design-code"]

#[[phases]]
#name = "implement"
#skills = ["implement-plan"]

#[[phases]]
#name = "review"
#skills = ["review-changes"]

#[[phases]]
#name = "merge-request"
#skills = ["write-merge-request"]

# The agents a flow can run. An agent you add here appears in flow start --agent and the new-flow
# dialog; one with a built-in name replaces it.
#
# command   the command line that starts a new session
# prompt    the first prompt, filled into {prompt}
# resume    the command line that continues a session after a restart; without one the agent
#           starts once and is not resumed
# adapter   "claude-code" or "codex": the harness flow reads the agent's state from. Without one
#           flow ui shows only whether the process runs.
#
# Placeholders: {id} flow's id for the session, {name} the flow's name, {request} what you asked
# for, {prompt} the prompt above, {session} the session id the harness picked (Codex),
# {instructions} the path of master.md, the master's instructions.

#[agents.claude]
#command = ["claude", "-n", "{name}", "--session-id", "{id}", "{prompt}"]
#prompt = "/ship-feature {request}"
#resume = ["claude", "-n", "{name}", "--resume", "{id}"]
#adapter = "claude-code"

#[agents.codex]
#command = ["codex", "{prompt}"]
#prompt = "$ship-feature {request}"
#resume = ["codex", "resume", "{session}"]
#adapter = "codex"

# The master: Claude Code without a first prompt; flow adds master.md to its instructions.
#[agents.master]
#command = ["claude", "-n", "{name}", "--session-id", "{id}"]
#prompt = ""
#resume = ["claude", "-n", "{name}", "--resume", "{id}"]
#adapter = "claude-code"

# An agent of your own, for example:
# [agents.aider]
# command = ["aider", "--message", "{prompt}"]
# prompt = "{request}"
