# saaio's settings.
#
# saaio wrote this file on its first run. Every setting is commented out at its default. Remove the
# # in front of one to change it. Once you've edited this file, saaio never overwrites it.
#
# Commands read this file every time they run. The UI and its server read it again when you save
# it. A running session keeps the command it started with. A broken file keeps the last working
# settings. A key saaio doesn't know is an error that names the file, line and key.
# The whole file, explained: https://github.com/JanSuthacheeva/saaio/blob/main/docs/configuration.md
#
# To use your own skills instead of the agent-skills set, set [worker] prompt and [[phases]]:
# https://github.com/JanSuthacheeva/saaio/blob/main/docs/configuration.md#use-your-own-workflow

#[worker]
# The agent a new flow runs when you don't pick one, by its name under [agents].
#agent = "claude"
# The first prompt for every agent that doesn't set its own, built-in agents included. Unset, each
# agent keeps its own. Claude Code calls a skill /name, Codex calls it $name.
# For example: prompt = "/my-feature {request}" ($my-feature in Codex)

#[master]
# Wakes the master when a worker stops. With false, it only finds out when it runs saaio status.
#wake = true
# The agent the UI runs as the master. Unset, it's the built-in "master" agent below.
# For example: agent = "codex"

#[ui]
# The key you press before every UI command: "C-space", or "C-a" to "C-z". C-c, C-d, C-h,
# C-i, C-j, C-m, C-q, C-s and C-z aren't allowed, because a pane needs them.
#prefix = "C-space"
# Once a day the UI asks GitHub for the latest release and names a newer one in its title row:
# "0.1.1 is out: saaio update". The one network call saaio makes on its own. false turns it off.
#update_check = true

#[services]
# Minutes a flow rests (idle, waiting, blocked, done or ended) before saaio runs the repo's
# .saaio/pause. Its .saaio/resume runs when the worker works again. 0 never pauses.
#pause_after_minutes = 5

# The workflow: one to four phases in order, each with the skills that start it. The UI shows them
# as a flow's steps. Your own list replaces all four. A flow whose skills match no phase still
# works. Its steps stay empty.
#[[phases]]
#name = "plan"
#skills = ["design-code"]

#[[phases]]
#name = "implement"
#skills = ["implement-plan"]

#[[phases]]
#name = "review"
#skills = ["review-changes"]

#[[phases]]
#name = "merge-request"
#skills = ["write-merge-request"]

# The agents a flow can run. Any agent you add here shows up in saaio start --agent and the new-flow
# dialog. An agent with a built-in name replaces the built-in one.
#
# command   the command line that starts a new session
# prompt    the first prompt, filled into {prompt}
# resume    the command line that continues a session after a restart. Without it, the agent
#           starts once and isn't resumed
# adapter   "claude-code" or "codex", the harness whose hooks tell saaio what the agent is doing.
#           Without it, the UI only shows whether the process is running.
#
# Placeholders: {id} is flow's id for the session, {name} the flow's name, {request} what you asked
# for, {prompt} the prompt above, {session} the session id the harness picked (Codex), and
# {instructions} the path of master.md, the master's instructions.

#[agents.claude]
#command = ["claude", "-n", "{name}", "--session-id", "{id}", "{prompt}"]
#prompt = "/ship-feature {request}"
#resume = ["claude", "-n", "{name}", "--resume", "{id}"]
#adapter = "claude-code"

#[agents.codex]
#command = ["codex", "{prompt}"]
#prompt = "$ship-feature {request}"
#resume = ["codex", "resume", "{session}"]
#adapter = "codex"

# The master is Claude Code without a first prompt. saaio adds master.md to its instructions.
#[agents.master]
#command = ["claude", "-n", "{name}", "--session-id", "{id}"]
#prompt = ""
#resume = ["claude", "-n", "{name}", "--resume", "{id}"]
#adapter = "claude-code"

# An agent of your own, for example:
# [agents.aider]
# command = ["aider", "--message", "{prompt}"]
# prompt = "{request}"
