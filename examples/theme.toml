# flow ui's colors.
#
# flow wrote this file on its first run. Every setting is commented out at its default, which is
# the terminal theme: your terminal's own colors. Remove the # in front of a setting to change it.
# Once you've edited this file, flow never overwrites it.
#
# flow ui repaints within a second of saving. If the file is broken, it keeps the last good colors
# and says in the title row which line is wrong and why.
#
# A color is one of:
#   "#rrggbb"   a hex color
#   0-255       an ANSI index. 0-15 are your terminal's own colors (4 is its blue)
#   "default"   the terminal's own foreground or background
#   "accent"    the name of another key, here or in the theme this one extends
#
# A key you leave out keeps the color of the theme this file extends.
# The whole file, explained: https://github.com/JanSuthacheeva/flow/blob/main/docs/themes.md

# The theme to start from: "terminal", "flow" (dark), "flow-light", or the name of a file in
# themes/ next to this one, without .toml.
#extends = "terminal"

# Set to true if your font has Nerd Font icons, and flow's mark becomes a kiwi bird. Otherwise the
# mark is a goose in flight, drawn in block characters every font has.
#nerd_font = false

# How much of a working flow takes its phase's color: "off" (state colors only), "steps" (the
# current step dot) or "full" (also the spinner, label, rail and title row).
#phase_colors = "off"

#[ui]
# The ground everything is drawn on.
#background = "default"
# The title row above the pane.
#panel = 235
# The row the keys go to: the selected session, field or card.
#selection = 236
# Lines and borders.
#rule = 8
# Ordinary text.
#text = "default"
# Names and titles, drawn bold.
#strong = "default"
# Quieter text, such as idle sessions and what a flow is doing.
#muted = 7
# The quietest text, such as key hints, headings and counts.
#faint = 8
# flow's mark and the bar beside the selected row.
#accent = 173

#[state]
# A flow at work.
#working = 4
# A flow that needs you.
#waiting = 3
# A flow that's blocked or not responding.
#blocked = 1
# A finished flow.
#done = 2
# A session that ended.
#ended = 8

#[phase]
# A phase's color, keyed by the phase's name in your workflow (config.toml [[phases]]). A phase
# without a color here takes the color of its place, so the 1st to 4th phase get these four.
#plan = 141
#implement = 75
#review = 80
#merge-request = 176
